name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        version=$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' glinet.go)
        if [ -z "$version" ]; then
          echo "::error file=glinet.go::Version constant not found or not in the form vX.Y.Z"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
          echo "Tag $VERSION exists. No release."
          exit 0
        fi
        gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
